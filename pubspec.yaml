name: wavoo_app
description: Flutter recreation of the Wavoo Jewellers interactive prototype.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  get: ^4.7.2
  cupertino_icons: ^1.0.8
  connectivity_plus: ^6.1.4
  flutter_svg: ^2.2.0
  google_fonts: ^6.3.0
  url_launcher: ^6.3.2
  dio: ^5.8.0+1
  uuid: ^4.5.1
  shared_preferences: ^2.5.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/svg/
